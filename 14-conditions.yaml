- name: conditions
  hosts: local
  connection: local
  vars:
    NUMBER: 78
  tasks:
  - name: check if number is less than or equal to 100
    ansible.builtin.debug:
      msg: "Given Number {{ NUMBER }} is greater than or equal to 100"
    when: NUMBER > 100
  - name: check if number is less than or equal to 100
    ansible.builtin.debug:
      msg: "Given Number {{ NUMBER }} is less than 100"
    when: NUMBER < 100