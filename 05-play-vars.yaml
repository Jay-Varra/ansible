- name: play level variables
  hosts: local
  connection: local
  vars:
    COURSE: Ansible
    DURATION: 10HR
    TRAINER: Sivakumar
  tasks:
  - name: print course name
    ansible.builtin.debug:
      msg: "Hello {{ COURSE }}, Course Duration is {{ DURATION }}, Trainer is {{ TRAINER }}"
  
  - name: print course name again
    ansible.builtin.debug:
      msg: "Hello {{ COURSE }}, Course Duration is {{ DURATION }}, Trainer is {{ TRAINER }}"