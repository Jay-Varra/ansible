- name: task level variables
  hosts: local
  connection: local
  vars:
    COURSE: DevOps with AWS
    DURATION: 10HR
    TRAINER: Sivakumar
  tasks:
  - name: print course information
    vars:
      COURSE: Ansible
    ansible.builtin.debug:
      msg: "Hello {{ COURSE }}, Course Duration is {{ DURATION }}, Trainer is {{ TRAINER }}"

  - name: print course information again
    ansible.builtin.debug:
      msg: "Hello {{ COURSE }}, Course Duration is {{ DURATION }}, Trainer is {{ TRAINER }}"